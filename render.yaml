services:
  - type: web
    name: diet-share-server
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: AI_PROVIDER
        value: stub
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: DEV_LOGIN_ENABLED
        value: "false"
      - key: WORKER_ENABLED
        value: "true"
