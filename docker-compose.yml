# Local development dependencies: Postgres, Redis and MinIO (S3-compatible, stands in for R2).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dietshare
      POSTGRES_USER: dietshare
      POSTGRES_PASSWORD: dietshare
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb -p local/diet-share &&
      mc ilm rule add --prefix temp/ --expire-days 1 local/diet-share || true
      "
